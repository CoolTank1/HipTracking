<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover" />
<title>My Semester</title>
<link rel="icon" href="data:,">
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="My Semester" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="theme-color" content="#faf3eb" />

<!-- Tailwind (utility classes used throughout the component) -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- Import map: load React, ReactDOM, and lucide-react straight from esm.sh, no build step -->
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.3.1",
    "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
    "react/jsx-dev-runtime": "https://esm.sh/react@18.3.1/jsx-dev-runtime",
    "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
    "lucide-react": "https://esm.sh/lucide-react@0.383.0?external=react"
  }
}
</script>

<!-- Babel standalone: transforms the JSX below, in the browser, at load time -->
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<style>
  html, body { margin: 0; padding: 0; background: #faf3eb; }
  #root { min-height: 100vh; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-type="module" data-presets="react">
import React, { useState, useEffect, useMemo, useRef } from "react";
import ReactDOM from "react-dom/client";
import {
  ChevronLeft, ChevronRight, Plus, X, Trash2, Pin, Heart,
  BookOpen, PartyPopper, Plane, Cake, CalendarDays,
  Settings2, Minus, Check, MapPin, Clock
} from "lucide-react";

// ---------- Palettes ----------
const CLASS_PALETTE = [
  { name: "Terracotta", value: "#C7A491" },
  { name: "Sage", value: "#9BA893" },
  { name: "Blush", value: "#D9A79E" },
  { name: "Stone", value: "#9AA0A8" },
  { name: "Olive", value: "#A8A177" },
  { name: "Rose", value: "#B98C8C" },
  { name: "Sand", value: "#C9B48A" },
  { name: "Clay", value: "#B08768" },
];

const CATEGORY = {
  event: { label: "Event", color: "#8FA3A8", icon: CalendarDays },
  birthday: { label: "Birthday", color: "#C79BAE", icon: Cake },
  trip: { label: "Trip", color: "#9BAE94", icon: Plane },
};

const ASSIGN_TYPE = {
  assignment: { label: "Assignment" },
  test: { label: "Test" },
  project: { label: "Project" },
};

function SegmentedControl({ options, value, onChange, fullWidth }) {
  return (
    <div
      className={`inline-flex items-center rounded-full p-1 gap-0.5 ${fullWidth ? "w-full" : ""}`}
      style={{ background: "#EECFCA" }}
      role="tablist"
    >
      {options.map((opt) => {
        const active = value === opt.value;
        return (
          <button
            key={opt.value}
            role="tab"
            aria-selected={active}
            onClick={() => onChange(opt.value)}
            className={`px-4 py-2 rounded-full font-medium ${fullWidth ? "flex-1" : ""}`}
            style={{
              fontSize: "0.85em",
              background: active ? "#FFFFFF" : "transparent",
              color: active ? "#6B5142" : "#96897E",
              boxShadow: active ? "0 1px 4px rgba(91,79,71,0.16)" : "none",
              transition: "all .15s ease",
            }}
          >
            {opt.label}
          </button>
        );
      })}
    </div>
  );
}

const DAYS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];

const pad = (n) => String(n).padStart(2, "0");
const toISO = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const uid = () => Math.random().toString(36).slice(2, 10);

function seedData() {
  const now = new Date();
  const y = now.getFullYear(), m = now.getMonth();
  const classId1 = uid(), classId2 = uid();
  return {
    classes: [
      { id: classId1, name: "Intro Psych", color: CLASS_PALETTE[2].value, location: "PAIS 290", schedule: [
        { day: 2, startTime: "10:00", endTime: "11:15" },
        { day: 4, startTime: "10:00", endTime: "11:15" },
      ] },
      { id: classId2, name: "Calculus I", color: CLASS_PALETTE[0].value, location: "MSC 130", schedule: [
        { day: 1, startTime: "09:00", endTime: "09:50" },
        { day: 3, startTime: "09:00", endTime: "09:50" },
        { day: 5, startTime: "09:00", endTime: "09:20" },
      ] },
    ],
    events: [
      { id: uid(), title: "Move-in Day", date: toISO(new Date(y, m, 3)), category: "event", notes: "Bring the fan!" },
      { id: uid(), title: "Sam's Birthday", date: toISO(new Date(y, m, 14)), category: "birthday", notes: "" },
      { id: uid(), title: "Weekend trip home", date: toISO(new Date(y, m, 22)), category: "trip", notes: "" },
    ],
    assignments: [
      { id: uid(), title: "Problem Set 2", classId: classId2, type: "assignment", dueDate: toISO(new Date(y, m, 10)), completed: false },
      { id: uid(), title: "Midterm 1", classId: classId1, type: "test", dueDate: toISO(new Date(y, m, 18)), completed: false },
    ],
    todos: [
      { id: uid(), title: "Order textbooks", dueDate: toISO(new Date(y, m, 5)), completed: false },
      { id: uid(), title: "Call about housing form", dueDate: null, completed: false },
    ],
  };
}

function CollegeCalendar() {
  const [classes, setClasses] = useState([]);
  const [events, setEvents] = useState([]);
  const [assignments, setAssignments] = useState([]);
  const [todos, setTodos] = useState([]);
  const [loaded, setLoaded] = useState(false);

  const [page, setPage] = useState("calendar"); // 'calendar' | 'assignments' | 'todo'
  const [view, setView] = useState("month"); // 'month' | 'week'
  const [cursor, setCursor] = useState(new Date());
  const [scale, setScale] = useState(1.1); // font scale, large print default
  const [selectedDate, setSelectedDate] = useState(null); // ISO string
  const [addOpen, setAddOpen] = useState(false);
  const [addTab, setAddTab] = useState("class");
  const [manageOpen, setManageOpen] = useState(false);
  const [prefillDate, setPrefillDate] = useState(null);

  // ---------- Load (localStorage, for standalone hosting) ----------
  useEffect(() => {
    try {
      const raw = localStorage.getItem("college-calendar-data");
      if (raw) {
        const parsed = JSON.parse(raw);
        setClasses(parsed.classes || []);
        setEvents(parsed.events || []);
        setAssignments(parsed.assignments || []);
        setTodos(parsed.todos || []);
        setLoaded(true);
        return;
      }
    } catch (e) {
      // no saved data yet
    }
    const seed = seedData();
    setClasses(seed.classes);
    setEvents(seed.events);
    setAssignments(seed.assignments);
    setTodos(seed.todos);
    setLoaded(true);
  }, []);

  // ---------- Save (localStorage, for standalone hosting) ----------
  useEffect(() => {
    if (!loaded) return;
    try {
      localStorage.setItem("college-calendar-data", JSON.stringify({ classes, events, assignments, todos }));
    } catch (e) {
      console.error("Save failed", e);
    }
  }, [classes, events, assignments, todos, loaded]);

  const classById = useMemo(() => {
    const map = {};
    classes.forEach((c) => (map[c.id] = c));
    return map;
  }, [classes]);

  function classesOnDate(date) {
    const dow = date.getDay();
    const result = [];
    classes.forEach((c) => {
      const slot = c.schedule.find((s) => s.day === dow);
      if (slot) result.push({ ...c, startTime: slot.startTime, endTime: slot.endTime });
    });
    return result;
  }
  function eventsOnDate(iso) {
    return events.filter((e) => e.date === iso);
  }
  function assignmentsOnDate(iso) {
    return assignments.filter((a) => a.dueDate === iso);
  }
  function todosOnDate(iso) {
    return todos.filter((t) => t.dueDate === iso);
  }
  function dueItemsOnDate(iso) {
    return [
      ...assignmentsOnDate(iso).map((a) => ({ ...a, kind: "assignment" })),
      ...todosOnDate(iso).map((t) => ({ ...t, kind: "todo" })),
    ];
  }

  function addClass(c) {
    setClasses((prev) => [...prev, { ...c, id: uid() }]);
  }
  function addEvent(e) {
    setEvents((prev) => [...prev, { ...e, id: uid() }]);
  }
  function addAssignment(a) {
    setAssignments((prev) => [...prev, { ...a, id: uid(), completed: false }]);
  }
  function addTodo(t) {
    setTodos((prev) => [...prev, { ...t, id: uid(), completed: false }]);
  }
  function toggleAssignmentComplete(id) {
    setAssignments((prev) => prev.map((a) => (a.id === id ? { ...a, completed: !a.completed } : a)));
  }
  function toggleTodoComplete(id) {
    setTodos((prev) => prev.map((t) => (t.id === id ? { ...t, completed: !t.completed } : t)));
  }
  function removeClass(id) {
    setClasses((prev) => prev.filter((c) => c.id !== id));
  }
  function removeEvent(id) {
    setEvents((prev) => prev.filter((e) => e.id !== id));
  }
  function removeAssignment(id) {
    setAssignments((prev) => prev.filter((a) => a.id !== id));
  }
  function removeTodo(id) {
    setTodos((prev) => prev.filter((t) => t.id !== id));
  }
  function removeDueItem(item) {
    if (item.kind === "todo") removeTodo(item.id);
    else removeAssignment(item.id);
  }

  // ---------- Calendar grid math ----------
  const monthMatrix = useMemo(() => {
    const y = cursor.getFullYear(), m = cursor.getMonth();
    const first = new Date(y, m, 1);
    const startOffset = first.getDay();
    const gridStart = new Date(y, m, 1 - startOffset);
    const weeks = [];
    let d = new Date(gridStart);
    for (let w = 0; w < 6; w++) {
      const row = [];
      for (let i = 0; i < 7; i++) {
        row.push(new Date(d));
        d.setDate(d.getDate() + 1);
      }
      weeks.push(row);
    }
    return weeks;
  }, [cursor]);

  const weekRow = useMemo(() => {
    const d = new Date(cursor);
    const offset = d.getDay();
    const start = new Date(d);
    start.setDate(d.getDate() - offset);
    const row = [];
    for (let i = 0; i < 7; i++) {
      const dd = new Date(start);
      dd.setDate(start.getDate() + i);
      row.push(dd);
    }
    return row;
  }, [cursor]);

  const today = new Date();
  const todayISO = toISO(today);

  function shiftMonth(delta) {
    setCursor(new Date(cursor.getFullYear(), cursor.getMonth() + delta, 1));
  }
  function shiftWeek(delta) {
    const d = new Date(cursor);
    d.setDate(d.getDate() + delta * 7);
    setCursor(d);
  }

  const scaledFont = 16 * scale;

  if (!loaded) {
    return (
      <div style={{ fontFamily: "Quicksand, sans-serif", fontSize: scaledFont, background: "#FAF3EB" }} className="min-h-screen flex items-center justify-center">
        <p className="text-lg" style={{ color: "#6B5142" }}>Loading your semester…</p>
      </div>
    );
  }

  return (
    <div
      style={{ fontSize: `${scaledFont}px`, fontFamily: "'Quicksand', sans-serif", background: "#FAF3EB" }}
      className="min-h-screen w-full"
    >
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Quicksand:wght@400;500;600;700&display=swap');
        .font-display { font-family: 'Fredoka', sans-serif; }
        .font-mono { font-family: 'Quicksand', sans-serif; font-weight: 600; }
        .stub-chip {
          border: 1.5px dashed currentColor;
          background: repeating-linear-gradient(135deg, rgba(0,0,0,0.03) 0px, rgba(0,0,0,0.03) 4px, transparent 4px, transparent 8px);
        }
        .day-cell { transition: transform .12s ease, box-shadow .12s ease; }
        .day-cell:hover { transform: translateY(-2px); box-shadow: 0 6px 14px rgba(30,20,10,0.12); }
        .pin-dot { box-shadow: 0 1px 2px rgba(0,0,0,0.35) inset, 0 1px 1px rgba(255,255,255,0.4); }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-thumb { background: #D9D2C4; border-radius: 4px; }
      `}</style>

      {/* Header */}
      <header className="sticky top-0 z-30" style={{ background: "#FFFFFF", borderBottom: "1px solid #DED7C9" }}>
        <div className="max-w-6xl mx-auto px-3 sm:px-6 pt-4 flex flex-wrap items-center gap-3 justify-between">
          <div className="flex items-center gap-3">
            <div className="w-9 h-9 rounded-full flex items-center justify-center shrink-0" style={{ background: "#C7A491" }}>
              <Heart size={16} color="white" fill="white" />
            </div>
            <h1 className="font-display" style={{ fontSize: "1.5em", fontWeight: 600, color: "#6B5142" }}>
              My Semester
            </h1>
          </div>

          <div className="flex items-center gap-2 flex-wrap">
            <div className="flex items-center rounded-full" style={{ background: "#C7CDBF" }}>
              <button aria-label="Decrease text size" onClick={() => setScale((s) => Math.max(0.9, +(s - 0.1).toFixed(2)))} className="p-2" style={{ color: "#96897E" }}>
                <Minus size={16} />
              </button>
              <span className="px-1 font-mono" style={{ fontSize: "0.7em", color: "#96897E" }}>Aa</span>
              <button aria-label="Increase text size" onClick={() => setScale((s) => Math.min(1.5, +(s + 0.1).toFixed(2)))} className="p-2" style={{ color: "#96897E" }}>
                <Plus size={16} />
              </button>
            </div>

            <button
              onClick={() => setManageOpen(true)}
              className="p-2 rounded-full"
              style={{ background: "#C7CDBF", color: "#6B5142" }}
              aria-label="Manage classes"
            >
              <Settings2 size={18} />
            </button>

            <button
              onClick={() => {
                setPrefillDate(null);
                setAddTab(page === "assignments" ? "assignment" : page === "todo" ? "todo" : "class");
                setAddOpen(true);
              }}
              className="flex items-center gap-1 px-4 py-2 rounded-full text-white font-semibold"
              style={{ background: "#C7A491" }}
            >
              <Plus size={18} /> Add
            </button>
          </div>
        </div>

        {/* Page tabs */}
        <div className="max-w-6xl mx-auto px-3 sm:px-6 pt-4">
          <SegmentedControl
            value={page}
            onChange={setPage}
            options={[
              { value: "calendar", label: "Calendar" },
              { value: "assignments", label: "Assignments" },
              { value: "todo", label: "To-Do" },
            ]}
          />
        </div>

        {/* Nav row */}
        {page === "calendar" && (
        <div className="max-w-6xl mx-auto px-3 sm:px-6 pt-4 pb-4 flex flex-wrap items-center justify-between gap-3">
          <div className="flex items-center gap-2">
            <button onClick={() => (view === "month" ? shiftMonth(-1) : shiftWeek(-1))} className="p-2 rounded-full" style={{ background: "#C7CDBF", color: "#6B5142" }}>
              <ChevronLeft size={20} />
            </button>
            <h2 className="font-display" style={{ fontSize: "1.2em", fontWeight: 600, minWidth: "10ch", color: "#6B5142" }}>
              {view === "month"
                ? `${MONTHS[cursor.getMonth()]} ${cursor.getFullYear()}`
                : `${MONTHS[weekRow[0].getMonth()]} ${weekRow[0].getDate()} – ${MONTHS[weekRow[6].getMonth()]} ${weekRow[6].getDate()}`}
            </h2>
            <button onClick={() => (view === "month" ? shiftMonth(1) : shiftWeek(1))} className="p-2 rounded-full" style={{ background: "#C7CDBF", color: "#6B5142" }}>
              <ChevronRight size={20} />
            </button>
          </div>

          <div className="flex items-center gap-2">
            <button
              onClick={() => setCursor(new Date())}
              className="px-3 py-1.5 rounded-full font-medium"
              style={{ background: "#FAF3EB", color: "#6B5142" }}
            >
              Today
            </button>
            <SegmentedControl
              value={view}
              onChange={setView}
              options={[
                { value: "month", label: "Month" },
                { value: "week", label: "Week" },
              ]}
            />
          </div>
        </div>
        )}

        {/* Legend */}
        {page === "calendar" && (
        <div className="max-w-6xl mx-auto px-3 sm:px-6 pb-3 flex gap-2 overflow-x-auto">
          {classes.map((c) => (
            <span key={c.id} className="flex items-center gap-1.5 px-2.5 py-1 rounded-full whitespace-nowrap" style={{ background: "#FAF3EB" }}>
              <span className="w-2.5 h-2.5 rounded-full pin-dot" style={{ background: c.color }} />
              <span style={{ fontSize: "0.75em", color: "#6B5142" }}>{c.name}</span>
            </span>
          ))}
          {Object.entries(CATEGORY).map(([k, v]) => (
            <span key={k} className="flex items-center gap-1.5 px-2.5 py-1 rounded-full whitespace-nowrap" style={{ background: "#FAF3EB" }}>
              <span className="w-2.5 h-2.5 rounded-full pin-dot" style={{ background: v.color }} />
              <span style={{ fontSize: "0.75em", color: "#6B5142" }}>{v.label}</span>
            </span>
          ))}
          <span className="flex items-center gap-1.5 px-2.5 py-1 rounded-full whitespace-nowrap stub-chip" style={{ color: "#96897E" }}>
            <span style={{ fontSize: "0.75em" }}>Due dates (dashed)</span>
          </span>
        </div>
        )}
      </header>


      {/* Body */}
      <main className="max-w-6xl mx-auto px-2 sm:px-6 py-6">
        {page === "assignments" ? (
          <AssignmentsPage
            classes={classes}
            assignments={assignments}
            classById={classById}
            onAdd={addAssignment}
            onToggle={toggleAssignmentComplete}
            onRemove={removeAssignment}
          />
        ) : page === "todo" ? (
          <ToDoPage
            todos={todos}
            onAdd={addTodo}
            onToggle={toggleTodoComplete}
            onRemove={removeTodo}
          />
        ) : view === "month" ? (
          <MonthGrid
            weeks={monthMatrix}
            cursorMonth={cursor.getMonth()}
            todayISO={todayISO}
            classesOnDate={classesOnDate}
            eventsOnDate={eventsOnDate}
            dueItemsOnDate={dueItemsOnDate}
            classById={classById}
            onSelect={(iso) => setSelectedDate(iso)}
          />
        ) : (
          <WeekGrid
            days={weekRow}
            todayISO={todayISO}
            classesOnDate={classesOnDate}
            eventsOnDate={eventsOnDate}
            dueItemsOnDate={dueItemsOnDate}
            classById={classById}
            onSelect={(iso) => setSelectedDate(iso)}
          />
        )}
      </main>

      {/* Day detail modal */}
      {selectedDate && (
        <DayModal
          iso={selectedDate}
          onClose={() => setSelectedDate(null)}
          classesOnDate={classesOnDate}
          eventsOnDate={eventsOnDate}
          dueItemsOnDate={dueItemsOnDate}
          classById={classById}
          removeEvent={removeEvent}
          removeDueItem={removeDueItem}
          onAddEvent={() => { setPrefillDate(selectedDate); setAddTab("event"); setAddOpen(true); }}
          onAddAssignment={() => { setPrefillDate(selectedDate); setAddTab("assignment"); setAddOpen(true); }}
          onAddTodo={() => { setPrefillDate(selectedDate); setAddTab("todo"); setAddOpen(true); }}
        />
      )}

      {/* Add modal */}
      {addOpen && (
        <AddModal
          tab={addTab}
          setTab={setAddTab}
          onClose={() => setAddOpen(false)}
          classes={classes}
          prefillDate={prefillDate}
          onAddClass={(c) => { addClass(c); setAddOpen(false); }}
          onAddEvent={(e) => { addEvent(e); setAddOpen(false); }}
          onAddAssignment={(a) => { addAssignment(a); setAddOpen(false); }}
          onAddTodo={(t) => { addTodo(t); setAddOpen(false); }}
        />
      )}

      {/* Manage classes modal */}
      {manageOpen && (
        <ManageModal
          classes={classes}
          onClose={() => setManageOpen(false)}
          onRemove={removeClass}
          onAddNew={() => { setManageOpen(false); setAddTab("class"); setAddOpen(true); }}
        />
      )}
    </div>
  );
}

// ---------- Month Grid ----------
function MonthGrid({ weeks, cursorMonth, todayISO, classesOnDate, eventsOnDate, dueItemsOnDate, classById, onSelect }) {
  return (
    <div className="rounded-2xl overflow-hidden" style={{ background: "#FFFFFF", border: "1px solid #DED7C9" }}>
      <div className="grid grid-cols-7">
        {DAYS.map((d) => (
          <div key={d} className="text-center py-2 font-semibold" style={{ color: "#96897E", fontSize: "0.85em", borderBottom: "1px solid #F2DFD6" }}>
            {d}
          </div>
        ))}
      </div>
      {weeks.map((row, ri) => (
        <div key={ri} className="grid grid-cols-7" style={{ borderTop: ri === 0 ? "none" : "1px solid #F2DFD6" }}>
          {row.map((date) => {
            const iso = toISO(date);
            const inMonth = date.getMonth() === cursorMonth;
            const classItems = classesOnDate(date);
            const evItems = eventsOnDate(iso);
            const dueItems = dueItemsOnDate(iso);
            const all = [...classItems.map((c) => ({ kind: "class", ...c })), ...evItems.map((e) => ({ kind: "event", ...e }))];
            const visible = all.slice(0, 2);
            const overflow = all.length - visible.length;
            return (
              <button
                key={iso}
                onClick={() => onSelect(iso)}
                className="day-cell text-left p-1.5 sm:p-2 flex flex-col gap-1 min-h-[5.5em] sm:min-h-[7em]"
                style={{
                  background: inMonth ? "#FFFFFF" : "#F2E9DE",
                  borderRight: "1px solid #F2DFD6",
                  opacity: inMonth ? 1 : 0.55,
                }}
              >
                <span
                  className="w-6 h-6 flex items-center justify-center rounded-full font-mono"
                  style={{
                    fontSize: "0.75em",
                    background: iso === todayISO ? "#C7A491" : "transparent",
                    color: iso === todayISO ? "white" : "#6B5142",
                    fontWeight: iso === todayISO ? 700 : 500,
                  }}
                >
                  {date.getDate()}
                </span>
                <div className="flex flex-col gap-0.5">
                  {visible.map((item, idx) => (
                    <span
                      key={idx}
                      className="truncate rounded px-1 py-0.5 text-white"
                      style={{ fontSize: "0.65em", background: item.kind === "class" ? item.color : CATEGORY[item.category].color }}
                    >
                      {item.kind === "class" ? item.name : item.title}
                    </span>
                  ))}
                  {overflow > 0 && (
                    <span style={{ fontSize: "0.65em", color: "#B8AFA2" }}>+{overflow} more</span>
                  )}
                  {dueItems.slice(0, 1).map((d) => {
                    const cls = d.kind === "assignment" && d.classId ? classById[d.classId] : null;
                    const color = cls ? cls.color : "#96897E";
                    return (
                      <span
                        key={d.id}
                        className="stub-chip truncate rounded px-1 py-0.5"
                        style={{ fontSize: "0.65em", color, textDecoration: d.completed ? "line-through" : "none", opacity: d.completed ? 0.55 : 1 }}
                      >
                        {d.kind === "todo" ? "To-do: " : "Due: "}{d.title}
                      </span>
                    );
                  })}
                  {dueItems.length > 1 && (
                    <span style={{ fontSize: "0.65em", color: "#B8AFA2" }}>+{dueItems.length - 1} due</span>
                  )}
                </div>
              </button>
            );
          })}
        </div>
      ))}
    </div>
  );
}

// ---------- Week Grid ----------
function WeekGrid({ days, todayISO, classesOnDate, eventsOnDate, dueItemsOnDate, classById, onSelect }) {
  return (
    <div className="grid grid-cols-1 sm:grid-cols-7 gap-3">
      {days.map((date) => {
        const iso = toISO(date);
        const classItems = classesOnDate(date).sort((a, b) => a.startTime.localeCompare(b.startTime));
        const evItems = eventsOnDate(iso);
        const dueItems = dueItemsOnDate(iso);
        const isToday = iso === todayISO;
        return (
          <button
            key={iso}
            onClick={() => onSelect(iso)}
            className="day-cell text-left rounded-2xl p-3 flex flex-col gap-2"
            style={{
              background: "#FFFFFF",
              border: isToday ? "2px solid #C7A491" : "1px solid #DED7C9",
              minHeight: "10em",
            }}
          >
            <div className="flex items-center justify-between">
              <span className="font-semibold" style={{ color: "#6B5142", fontSize: "0.9em" }}>{DAYS[date.getDay()]} {date.getDate()}</span>
              {isToday && <span className="px-2 py-0.5 rounded-full text-white" style={{ background: "#C7A491", fontSize: "0.6em" }}>Today</span>}
            </div>
            <div className="flex flex-col gap-1">
              {classItems.map((c) => (
                <div key={c.id} className="rounded px-1.5 py-1 text-white flex items-center gap-1" style={{ background: c.color, fontSize: "0.7em" }}>
                  <Clock size={11} /> {c.startTime}–{c.endTime} {c.name}
                </div>
              ))}
              {evItems.map((e) => (
                <div key={e.id} className="rounded px-1.5 py-1 text-white" style={{ background: CATEGORY[e.category].color, fontSize: "0.7em" }}>
                  {e.title}
                </div>
              ))}
              {dueItems.map((d) => {
                const cls = d.kind === "assignment" && d.classId ? classById[d.classId] : null;
                const color = cls ? cls.color : "#96897E";
                return (
                  <div key={d.id} className="stub-chip rounded px-1.5 py-1" style={{ color, fontSize: "0.7em", textDecoration: d.completed ? "line-through" : "none", opacity: d.completed ? 0.55 : 1 }}>
                    {d.kind === "todo" ? `To-do: ${d.title}` : `Due: ${d.title} (${ASSIGN_TYPE[d.type].label})`}
                  </div>
                );
              })}
              {classItems.length + evItems.length + dueItems.length === 0 && (
                <span style={{ color: "#C9BCAE", fontSize: "0.75em" }}>Nothing scheduled</span>
              )}
            </div>
          </button>
        );
      })}
    </div>
  );
}

// ---------- Assignments Page ----------
function AssignmentsPage({ classes, assignments, classById, onAdd, onToggle, onRemove }) {
  const sorted = [...assignments].sort((a, b) => a.dueDate.localeCompare(b.dueDate));
  const todayISO = toISO(new Date());

  return (
    <div className="flex flex-col gap-8">
      <div className="rounded-2xl p-5" style={{ background: "#FFFFFF", border: "1px solid #DED7C9" }}>
        <h3 className="font-display mb-4" style={{ fontSize: "1.15em", fontWeight: 600, color: "#6B5142" }}>
          Add an assignment, test, or project
        </h3>
        <AssignmentForm onSubmit={onAdd} classes={classes} />
      </div>

      <div>
        <h3 className="font-display mb-3" style={{ fontSize: "1.15em", fontWeight: 600, color: "#6B5142" }}>
          All Assignments
        </h3>
        <div className="flex flex-col gap-2">
          {sorted.length === 0 && <Empty text="Nothing on your plate yet." />}
          {sorted.map((a) => {
            const cls = a.classId ? classById[a.classId] : null;
            return (
              <ChecklistRow
                key={a.id}
                item={a}
                color={cls ? cls.color : "#96897E"}
                subtitle={`${ASSIGN_TYPE[a.type].label}${cls ? " · " + cls.name : ""}`}
                overdue={!a.completed && a.dueDate < todayISO}
                onToggle={() => onToggle(a.id)}
                onRemove={() => onRemove(a.id)}
              />
            );
          })}
        </div>
      </div>

      {classes.map((c) => {
        const items = sorted.filter((a) => a.classId === c.id);
        if (items.length === 0) return null;
        return (
          <div key={c.id}>
            <h3 className="font-display mb-3 flex items-center gap-2" style={{ fontSize: "1.15em", fontWeight: 600, color: "#6B5142" }}>
              <span className="w-3 h-3 rounded-full pin-dot" style={{ background: c.color }} />
              {c.name}
            </h3>
            <div className="flex flex-col gap-2">
              {items.map((a) => (
                <ChecklistRow
                  key={a.id}
                  item={a}
                  color={c.color}
                  subtitle={ASSIGN_TYPE[a.type].label}
                  overdue={!a.completed && a.dueDate < todayISO}
                  onToggle={() => onToggle(a.id)}
                  onRemove={() => onRemove(a.id)}
                />
              ))}
            </div>
          </div>
        );
      })}

      {assignments.some((a) => !a.classId) && (
        <div>
          <h3 className="font-display mb-3" style={{ fontSize: "1.15em", fontWeight: 600, color: "#6B5142" }}>
            Other
          </h3>
          <div className="flex flex-col gap-2">
            {sorted.filter((a) => !a.classId).map((a) => (
              <ChecklistRow
                key={a.id}
                item={a}
                color="#96897E"
                subtitle={ASSIGN_TYPE[a.type].label}
                overdue={!a.completed && a.dueDate < todayISO}
                onToggle={() => onToggle(a.id)}
                onRemove={() => onRemove(a.id)}
              />
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

// ---------- To-Do Page ----------
function ToDoPage({ todos, onAdd, onToggle, onRemove }) {
  const todayISO = toISO(new Date());
  const withDate = todos.filter((t) => t.dueDate).sort((a, b) => a.dueDate.localeCompare(b.dueDate));
  const withoutDate = todos.filter((t) => !t.dueDate);

  return (
    <div className="flex flex-col gap-8">
      <div className="rounded-2xl p-5" style={{ background: "#FFFFFF", border: "1px solid #DED7C9" }}>
        <h3 className="font-display mb-4" style={{ fontSize: "1.15em", fontWeight: 600, color: "#6B5142" }}>
          Add a to-do
        </h3>
        <TodoForm onSubmit={onAdd} />
      </div>

      <div>
        <h3 className="font-display mb-3" style={{ fontSize: "1.15em", fontWeight: 600, color: "#6B5142" }}>
          To-Do List
        </h3>
        <div className="flex flex-col gap-2">
          {todos.length === 0 && <Empty text="Nothing on your list yet." />}
          {withDate.map((t) => (
            <ChecklistRow
              key={t.id}
              item={t}
              color="#C7A491"
              subtitle={null}
              overdue={!t.completed && t.dueDate < todayISO}
              onToggle={() => onToggle(t.id)}

          {withoutDate.map((t) => (
            <ChecklistRow
              key={t.id}

function ChecklistRow({ item, color, subtitle, overdue, onToggle, onRemove }) {
  return (
    <div
      className="flex items-center gap-3 rounded-xl px-4 py-3"
      style={{ background: "#FFFFFF", border: `1px solid ${overdue ? "#B06A52" : "#DED7C9"}` }}
    >
      <button
        onClick={onToggle}
        aria-label={item.completed ? "Mark incomplete" : "Mark complete"}
        className="w-6 h-6 rounded-full flex items-center justify-center shrink-0"
        style={{ border: `2px solid ${color}`, background: item.completed ? color : "transparent" }}
      >
        {item.completed && <Check size={14} color="white" />}
      </button>
      <div className="flex-1 min-w-0">
        <p
          className="font-medium truncate"
          style={{
            fontSize: "0.95em",
            color: item.completed ? "#B8AFA2" : "#6B5142",
            textDecoration: item.completed ? "line-through" : "none",
          }}
        >
          {item.title}
        </p>
        {(subtitle || item.dueDate) && (
          <p style={{ fontSize: "0.75em", color: overdue ? "#B06A52" : "#B8AFA2" }}>
            {subtitle}
            {subtitle && item.dueDate ? " · " : ""}
            {item.dueDate ? `${overdue ? "Overdue: " : "Due "}${item.dueDate}` : ""}
          </p>
        )}
      </div>
      <button onClick={onRemove} aria-label="Delete" className="p-1 rounded-full shrink-0" style={{ color: "#B8AFA2" }}>
        <Trash2 size={16} />
      </button>
    </div>
  );
}

function Field({ label, children }) {
  return (
    <label className="block mb-3">
      <span className="block font-medium mb-1" style={{ fontSize: "0.85em", color: "#96897E" }}>{label}</span>
      {children}

const inputStyle = {
  width: "100%",
  padding: "0.6em 0.8em",
  borderRadius: "0.6em",
  border: "1px solid #DED7C9",
  background: "white",
  fontSize: "0.95em",
  color: "#6B5142",
};

function ClassForm({ onSubmit }) {
  const [name, setName] = useState("");
  const [color, setColor] = useState(CLASS_PALETTE[0].value);
  const [location, setLocation] = useState("");
  const [defaultStart, setDefaultStart] = useState("09:00");
  const [defaultEnd, setDefaultEnd] = useState("09:50");
  const [varyByDay, setVaryByDay] = useState(false);
  // map of day index -> { startTime, endTime }, only for selected days
  const [dayTimes, setDayTimes] = useState({});

  const selectedDays = Object.keys(dayTimes).map(Number).sort((a, b) => a - b);

  function toggleDay(i) {
    setDayTimes((prev) => {
      const next = { ...prev };
      if (next[i]) {
        delete next[i];
      } else {
        next[i] = { startTime: defaultStart, endTime: defaultEnd };
      }
      return next;
    });
  }

  function updateDayTime(i, field, value) {
    setDayTimes((prev) => ({ ...prev, [i]: { ...prev[i], [field]: value } }));
  }

  function handleSubmit() {
    const schedule = selectedDays.map((i) => ({
      day: i,
      startTime: varyByDay ? dayTimes[i].startTime : defaultStart,
      endTime: varyByDay ? dayTimes[i].endTime : defaultEnd,
    }));
    onSubmit({ name, color, location, schedule });
  }

  return (
    <div>
      <Field label="Class name">
        <input style={inputStyle} value={name} onChange={(e) => setName(e.target.value)} placeholder="e.g. Organic Chemistry" />
      </Field>
      <Field label="Color">
        <div className="flex flex-wrap gap-2">
          {CLASS_PALETTE.map((p) => (
            <button
              key={p.value}
              onClick={() => setColor(p.value)}
              aria-label={p.name}
              className="w-8 h-8 rounded-full pin-dot"
              style={{ background: p.value, border: color === p.value ? "3px solid #6B5142" : "none" }}
            />
          ))}
        </div>
      </Field>
      <Field label="Days it meets">
        <div className="flex gap-1.5 flex-wrap">
          {DAYS.map((d, i) => (
            <button
              key={d}
              onClick={() => toggleDay(i)}
              className="px-3 py-1.5 rounded-full font-medium"
              style={{ fontSize: "0.8em", background: dayTimes[i] ? "#6B5142" : "#FAF3EB", color: dayTimes[i] ? "white" : "#96897E" }}
            >
              {d}
            </button>
          ))}
        </div>
      </Field>

      <div className="grid grid-cols-2 gap-3">
        <Field label={varyByDay ? "Default start time" : "Start time"}>
          <input
            type="time"
            style={inputStyle}
            value={defaultStart}
            onChange={(e) => setDefaultStart(e.target.value)}
          />
        </Field>
        <Field label={varyByDay ? "Default end time" : "End time"}>
          <input
            type="time"
            style={inputStyle}
            value={defaultEnd}
            onChange={(e) => setDefaultEnd(e.target.value)}
          />
        </Field>
      </div>

      <button
        onClick={() => setVaryByDay((v) => !v)}
        className="flex items-center gap-2 mb-3"
        type="button"
      >
        <span
          className="w-5 h-5 rounded flex items-center justify-center"
          style={{ background: varyByDay ? "#C7A491" : "#EECFCA" }}
        >
          {varyByDay && <Check size={14} color="white" />}
        </span>
        <span style={{ fontSize: "0.85em", color: "#96897E" }}>Times are different on some days (e.g. shorter on Friday)</span>
      </button>

      {varyByDay && selectedDays.length > 0 && (
        <div className="mb-3 flex flex-col gap-2 p-3 rounded-xl" style={{ background: "#FAF3EB" }}>
          {selectedDays.map((i) => (
            <div key={i} className="flex items-center gap-2">
              <span className="w-10 font-medium" style={{ fontSize: "0.8em", color: "#6B5142" }}>{DAYS[i]}</span>
              <input
                type="time"
                style={{ ...inputStyle, padding: "0.4em 0.6em" }}
                value={dayTimes[i].startTime}
                onChange={(e) => updateDayTime(i, "startTime", e.target.value)}
              />
              <span style={{ color: "#B8AFA2" }}>–</span>
              <input
                type="time"
                style={{ ...inputStyle, padding: "0.4em 0.6em" }}
                value={dayTimes[i].endTime}
                onChange={(e) => updateDayTime(i, "endTime", e.target.value)}
              />
            </div>
          ))}
        </div>
      )}

      <Field label="Location (optional)">
        <input style={inputStyle} value={location} onChange={(e) => setLocation(e.target.value)} placeholder="e.g. Science Building 210" />
      </Field>
      <button
        disabled={!name || selectedDays.length === 0}
        onClick={handleSubmit}
        className="w-full mt-2 py-3 rounded-full font-semibold text-white disabled:opacity-40"
        style={{ background: "#C7A491" }}
      >
        Save class
      </button>
    </div>
  );
}

        </select>
      </Field>
      <Field label="Type">
        <div className="flex gap-2">
          {Object.entries(ASSIGN_TYPE).map(([k, v]) => (
            <button
              key={k}
              onClick={() => setType(k)}
              className="flex-1 py-2 rounded-full font-medium"
              style={{ fontSize: "0.8em", background: type === k ? "#6B5142" : "#FAF3EB", color: type === k ? "white" : "#96897E" }}
            >
              {v.label}
            </button>
          ))}
        </div>
      </Field>
      <Field label="Due date">
        <input type="date" style={inputStyle} value={dueDate} onChange={(e) => setDueDate(e.target.value)} />
      </Field>
      <button
        disabled={!title || !dueDate}
        onClick={() => {
          onSubmit({ title, classId: classId || null, type, dueDate });
          setTitle("");
        }}
        className="w-full mt-2 py-3 rounded-full font-semibold text-white disabled:opacity-40"
        style={{ background: "#C7A491" }}
      >
        Save
      </button>
    </div>
  );
}

function TodoForm({ onSubmit, prefillDate }) {
  const [title, setTitle] = useState("");
  const [hasDueDate, setHasDueDate] = useState(!!prefillDate);
  const [dueDate, setDueDate] = useState(prefillDate || toISO(new Date()));

  return (
    <div>
      <Field label="What do you need to do?">
        <input style={inputStyle} value={title} onChange={(e) => setTitle(e.target.value)} placeholder="e.g. Call about housing form" />
      </Field>
      <button
        onClick={() => setHasDueDate((v) => !v)}
        className="flex items-center gap-2 mb-3"
        type="button"
      >
        <span
          className="w-5 h-5 rounded flex items-center justify-center"
          style={{ background: hasDueDate ? "#C7A491" : "#EECFCA" }}
        >
          {hasDueDate && <Check size={14} color="white" />}
        </span>
        <span style={{ fontSize: "0.85em", color: "#96897E" }}>Give it a due date (shows on the calendar)</span>
      </button>
      {hasDueDate && (
        <Field label="Due date">
          <input type="date" style={inputStyle} value={dueDate} onChange={(e) => setDueDate(e.target.value)} />
        </Field>
      )}
      <button
        disabled={!title}
        onClick={() => {
          onSubmit({ title, dueDate: hasDueDate ? dueDate : null });
          setTitle("");
        }}
        className="w-full mt-2 py-3 rounded-full font-semibold text-white disabled:opacity-40"
        style={{ background: "#C7A491" }}
      >
        Save
      </button>
    </div>
  );
}

// ---------- Manage classes modal ----------
function ManageModal({ classes, onClose, onRemove, onAddNew }) {
  return (
    <div className="fixed inset-0 z-40 flex items-end sm:items-center justify-center p-0 sm:p-4" style={{ background: "rgba(30,25,15,0.45)" }} onClick={onClose}>
      <div className="w-full sm:max-w-md rounded-t-2xl sm:rounded-2xl p-5 max-h-[85vh] overflow-y-auto" style={{ background: "#FFFFFF" }} onClick={(e) => e.stopPropagation()}>
        <div className="flex items-center justify-between mb-4">
          <h3 className="font-display" style={{ fontSize: "1.3em", fontWeight: 700, color: "#6B5142" }}>Your classes</h3>
          <button onClick={onClose} className="p-1.5 rounded-full" style={{ background: "#FAF3EB" }}><X size={18} /></button>
        </div>
        <div className="flex flex-col gap-2 mb-4">
          {classes.length === 0 && <Empty text="No classes added yet." />}
          {classes.map((c) => (
            <div key={c.id} className="flex items-center justify-between rounded-lg px-3 py-2" style={{ background: c.color, color: "white" }}>
              <div>
                <p className="font-medium" style={{ fontSize: "0.95em" }}>{c.name}</p>
                <p style={{ fontSize: "0.75em", opacity: 0.9 }}>
                  {c.schedule
                    .slice()
                    .sort((a, b) => a.day - b.day)
                    .map((s) => `${DAYS[s.day]} ${s.startTime}–${s.endTime}`)
                    .join(" · ")}
                </p>
              </div>
              <button onClick={() => onRemove(c.id)} aria-label="Delete class" className="p-1 rounded-full">
                <Trash2 size={15} />
              </button>
            </div>
          ))}
        </div>
        <button onClick={onAddNew} className="w-full py-3 rounded-full font-semibold text-white flex items-center justify-center gap-2" style={{ background: "#C7A491" }}>
          <Plus size={18} /> Add a class
        </button>
      </div>
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<CollegeCalendar />);
</script>
</body>
</html>
